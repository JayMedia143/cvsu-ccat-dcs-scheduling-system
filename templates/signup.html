{% extends "base.html" %}

{% block title %}User Registration{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <!-- 1. HEADER -->
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-success bg-opacity-10 rounded-circle mb-3" style="width: 64px; height: 64px;">
                    <i class="bi bi-person-plus-fill fs-2 text-success"></i>
                </div>
                <h1 class="h3 fw-bold text-gray-800 mb-1">User Registration</h1>
                <p class="text-muted small">Create a new administrative or faculty account.</p>
            </div>

            <!-- 2. FORM CARD -->
            <div class="bg-white rounded-4 border shadow-sm overflow-hidden p-4 p-md-5">
                <form action="{{ url_for('signup') }}" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <!-- Username -->
                    <div class="mb-4">
                        <label class="form-label small text-muted fw-bold text-uppercase" style="letter-spacing: 0.5px;">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-secondary"></i></span>
                            <input type="text" name="username" class="form-control bg-light border-start-0" 
                                placeholder="Choose a username" required autocomplete="username" maxlength="50" style="padding: 0.75rem;">
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="mb-4">
                        <label class="form-label small text-muted fw-bold text-uppercase" style="letter-spacing: 0.5px;">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-secondary"></i></span>
                            <input type="password" name="password" class="form-control bg-light border-start-0" 
                                placeholder="Create a password" required minlength="4" autocomplete="new-password" maxlength="100" style="padding: 0.75rem;">
                        </div>
                    </div>

                    <!-- Confirm Password -->
                    <div class="mb-4">
                        <label class="form-label small text-muted fw-bold text-uppercase" style="letter-spacing: 0.5px;">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-check text-secondary"></i></span>
                            <input type="password" name="confirm_password" class="form-control bg-light border-start-0" 
                                placeholder="Repeat password" required minlength="4" autocomplete="new-password" maxlength="100" style="padding: 0.75rem;">
                        </div>
                    </div>

                    <!-- Department -->
                    <div class="mb-5">
                        <label class="form-label small text-muted fw-bold text-uppercase" style="letter-spacing: 0.5px;">Department</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-building text-secondary"></i></span>
                            <select name="department" class="form-select bg-light border-start-0 cursor-pointer" required style="padding: 0.75rem;">
                                <option value="" disabled selected>Select department</option>
                                {% for dept in departments %}
                                <option value="{{ dept }}">{{ dept }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-success w-100 py-3 fw-bold rounded-3 shadow-sm transition-all hover-lift" id="submitBtn">
                        <span class="d-flex align-items-center justify-content-center">
                            <i class="bi bi-check-circle-fill me-2"></i> Register New Account
                        </span>
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <a href="{{ url_for('manage_users') }}" class="text-decoration-none text-muted small hover-success transition-all">
                        <i class="bi bi-arrow-left me-1"></i> Back to User Management
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Simple spinner on submit
    document.querySelector('form').addEventListener('submit', function() {
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Registering...';
    });
</script>

<style>
    .hover-lift:hover {
        transform: translateY(-2px);
    }
    .hover-success:hover {
        color: #198754 !important;
    }
    .transition-all {
        transition: all 0.2s ease-in-out;
    }
</style>
{% endblock %}
