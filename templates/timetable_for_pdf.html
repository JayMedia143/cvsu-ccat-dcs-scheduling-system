<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Schedule Export</title>
    <style>
        /* PDF specific CSS for WeasyPrint */
        @page {
            size: landscape; /* Or whatever fits best, we use landscape for schedules usually */
            margin: 1cm;
        }

        body { 
            font-family: sans-serif;
            background: white;
            margin: 0;
            padding: 0;
            color: black;
            font-size: 11px; /* Slightly smaller base font for PDF density */
        }
        
        .excel-rendered-table {
            border-collapse: collapse;
            table-layout: fixed;
            width: 100%; /* Force Weasyprint to scale the table into the landscape page width */
        }
        
        .excel-rendered-table td, 
        .excel-rendered-table th {
            border: 1px solid #000 !important;
            padding: 2px;
            text-align: center;
            vertical-align: middle;
            font-family: Arial, sans-serif;
            word-wrap: break-word;
        }

        /* Essential lucky-sheet classes copied over */
        .overlap-badge {
            background-color: #dc3545;
            color: #fff;
            border-radius: 50%;
            padding: 1px 5px;
            font-size: 10px;
        }
    </style>
</head>
<body>
    <div class="pdf-container">
        {{ html_content | safe }}
    </div>
</body>
</html>
