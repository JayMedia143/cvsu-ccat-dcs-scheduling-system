<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal — CvSU-CCAT Scheduling System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="auth-page">

    <div class="auth-right">
        <div class="auth-form-box">

            <div class="auth-system-badge">
                <span class="auth-badge-dot"></span> CvSU-CCAT DCS
            </div>

            <div class="auth-accent-line"></div>

            <div class="auth-form-heading">Student Portal</div>
            <div class="auth-form-subtext">Enter your Student ID to view your class schedule.</div>

            <hr class="auth-form-divider">

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="mb-3">
                {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show border-0 py-2 small" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <form action="{{ url_for('student_portal') }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="auth-input-group">
                    <label class="auth-input-label">Student ID</label>
                    <i class="bi bi-person-badge input-icon"></i>
                    <input type="text" name="student_id" placeholder="e.g. 2023-0001" required
                        autocomplete="off">
                </div>

                <button type="submit" class="btn-auth mt-1">View My Schedule</button>
            </form>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        window.addEventListener('pageshow', function () {
            var btn = document.querySelector('.btn-auth');
            btn.innerHTML = 'View My Schedule';
            btn.disabled = false;
        });
        document.querySelector('form').addEventListener('submit', function () {
            var btn = document.querySelector('.btn-auth');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Looking up...';
            btn.disabled = true;
        });
    </script>
</body>

</html>
