{% extends "base.html" %}

{% block title %}View Timetable{% endblock %}

{% block content %}

<style>
    /* ── Pagination iframe ─────────────────────────────────────── */
    #scheduleFrame {
        width: 100%;
        border: none;
        display: block;
        min-height: 600px;
    }

    /* ── Filter toolbar in scroll mode ────────────────────────── */
    #filterToolbar.scroll-mode {
        border-radius: 0 !important;
        border-left: none !important;
        border-right: none !important;
        margin-top: -48px !important;
        margin-bottom: 0 !important;
        /* Break out to full viewport width */
        width: 100vw;
        position: relative;
        left: 50%;
        transform: translateX(-50%);
    }

    /* ── Scroll mode ───────────────────────────────────────────── */
    #scrollContent {
        background: #e9ecef;
        padding: 16px 0;
        /* Break out of .main-content max-width container → full viewport width */
        width: 100vw;
        position: relative;
        left: 50%;
        transform: translateX(-50%);
    }
    #scrollPagesInner {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        padding: 0 16px;
        align-items: flex-start;
        justify-content: center;
        transform-origin: top left;
    }
    .scroll-sched-page {
        flex-shrink: 0;
        width: fit-content;
        border: 1px solid #dee2e6;
        border-radius: 6px;
        overflow: hidden;
        background: #fff;
        box-shadow: 0 2px 8px rgba(0,0,0,0.10);
    }

    @media print {

        .sheets-header,
        .sheets-menubar,
        .btn,
        form,
        .alert,
        .d-flex,
        #schedNavBar {
            display: none !important;
        }

        .main-content {
            margin: 0 !important;
            padding: 0 !important;
            width: 100% !important;
        }

        * {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }
    }
</style>

<!-- FILTER TOOLBAR -->
<div id="filterToolbar" class="bg-white p-3 rounded border shadow-sm mb-3" style="margin-top: -48px;">
    <div class="row g-2 align-items-center">
        <!-- Semester history selector -->
        <div class="col-auto">
            <span class="text-secondary small fw-bold text-uppercase me-1">SEMESTER:</span>
        </div>
        <div class="col-auto">
            {% if available_semesters %}
            <div class="btn-group btn-group-sm" role="group">
                {% for sem in available_semesters %}
                <button type="button"
                    class="btn {% if sem == current_semester %}btn-success{% else %}btn-outline-secondary{% endif %} semester-btn"
                    data-sem="{{ sem }}" onclick="switchSemester('{{ sem }}')">
                    {{ sem }}
                </button>
                {% endfor %}
            </div>
            {% else %}
            <span class="text-muted small fst-italic">No schedule generated yet.</span>
            {% endif %}
        </div>
        <!-- Divider -->
        <div class="col-auto text-secondary">|</div>
        <div class="col-auto">
            <span class="text-secondary small fw-bold text-uppercase me-2">VIEW BY:</span>
        </div>
        <div class="col-auto">
            <select id="typeSelect" class="form-select form-select-sm border-secondary bg-light fw-bold"
                style="width: 160px;" onchange="onTypeChange()">
                <option value="section" {% if current_type=='section' %}selected{% endif %}>Student Section</option>
                <option value="faculty" {% if current_type=='faculty' %}selected{% endif %}>Faculty Member</option>
                <option value="room" {% if current_type=='room' %}selected{% endif %}>Room</option>
            </select>
        </div>
        <div class="col flex-grow-1">
            <select id="entitySelect" class="form-select form-select-sm border-secondary" onchange="loadSchedule()">
                {% if current_type == 'section' %}
                {% for s in all_sections %}
                <option value="{{ s.id }}" {% if current_id==s.id %}selected{% endif %}>{{ s.section_name }} ({{
                    s.year_level }}Yr)</option>
                {% endfor %}
                {% elif current_type == 'faculty' %}
                {% for f in all_faculty %}
                <option value="{{ f.id }}" {% if current_id==f.id %}selected{% endif %}>{{ f.full_name }}</option>
                {% endfor %}
                {% elif current_type == 'room' %}
                {% for r in all_rooms %}
                <option value="{{ r.id }}" {% if current_id==r.id %}selected{% endif %}>{{ r.room_name }} ({{ r.building
                    }})</option>
                {% endfor %}
                {% endif %}
            </select>
        </div>
        <!-- View mode toggle -->
        <div class="col-auto">
            <div class="btn-group btn-group-sm" id="viewModeGroup" role="group">
                <button id="btnPagination" type="button"
                    class="btn btn-outline-secondary active"
                    onclick="setViewMode('pagination')"
                    title="Pagination — one schedule at a time">
                    <i class="bi bi-file-earmark"></i>
                </button>
                <button id="btnScroll" type="button"
                    class="btn btn-outline-secondary"
                    onclick="setViewMode('scroll')"
                    title="Scroll — all schedules stacked (Ctrl+scroll to zoom)">
                    <i class="bi bi-layout-text-window-reverse"></i>
                </button>
            </div>
        </div>
        <!-- PDF download — only active for Section view -->
        <div class="col-auto" id="pdfBtnWrap">
            <a id="pdfExportLink" href="#" target="_blank"
               class="btn btn-sm btn-outline-danger"
               title="Download PDF for current section"
               style="pointer-events:none;opacity:0.4;">
                <i class="bi bi-file-earmark-pdf"></i>
            </a>
        </div>
    </div>
</div>

<!-- 3. SCHEDULE CONTENT — iframe-based pagination display -->
<iframe id="scheduleFrame" src="about:blank" title="Schedule Timetable"></iframe>

<!-- SCROLL MODE CONTENT -->
<div id="scrollContent" style="display:none; overflow-x:auto;">
    <div id="scrollPagesInner"></div>
</div>

<!-- 4. NAVIGATION BAR — always at the bottom -->
<div id="schedNavBar" class="mt-3">
    <!-- Prev / position counter / Next -->
    <nav aria-label="Schedule navigation">
        <ul class="pagination justify-content-center mb-2">
            <li class="page-item" id="liPrev">
                <a class="page-link" href="#" onclick="navigate(-1); return false;">
                    <i class="bi bi-chevron-left"></i>
                </a>
            </li>
            <li class="page-item disabled">
                <span class="page-link px-3" id="navLabel" style="min-width:90px;text-align:center;">—</span>
            </li>
            <li class="page-item" id="liNext">
                <a class="page-link" href="#" onclick="navigate(1); return false;">
                    <i class="bi bi-chevron-right"></i>
                </a>
            </li>
        </ul>
    </nav>
    <!-- Jump-to -->
    <div class="d-flex align-items-center justify-content-center gap-2 text-muted" style="font-size:0.85rem;">
        <span>Jump to:</span>
        <input type="number" id="schedJumpInput" class="form-control form-control-sm text-center" style="width:70px;"
            min="1" placeholder="1–?">
        <button class="btn btn-sm btn-outline-secondary px-3" onclick="schedJump()">Go</button>
        <span class="text-muted" style="font-size:0.75rem;">
            <i class="bi bi-arrow-left-short"></i><i class="bi bi-arrow-right-short"></i> arrow keys
        </span>
    </div>
</div>

<script>
(function () {
    // ── Data passed from Flask ──────────────────────────────────────────
    const _sec = {{ sections_json | tojson | safe }};
    const _fac = {{ faculty_json  | tojson | safe }};
    const _rom = {{ rooms_json    | tojson | safe }};

    const listMap = { section: _sec, faculty: _fac, room: _rom };

    let currentType     = {{ current_type     | tojson | safe }};
    let currentId       = {{ current_id       | tojson | safe }};
    let currentSemester = {{ current_semester | tojson | safe }};
    let viewMode        = 'pagination';
    let scrollZoom      = 1.0;

    // ── Route map for timetable HTML and PDF routes ─────────────────────
    const htmlRouteMap = {
        section: (id, sem) => `/section-timetable-html/${id}?semester=${encodeURIComponent(sem)}`,
        faculty: (id, sem) => `/faculty-timetable-html/${id}?semester=${encodeURIComponent(sem)}`,
        room:    (id, sem) => `/room-timetable-html/${id}?semester=${encodeURIComponent(sem)}`,
        course:  (id, sem) => `/course-timetable-html/${id}?semester=${encodeURIComponent(sem)}`,
    };
    const pdfRouteMap = {
        section: (id, sem) => `/section-timetable-pdf/${id}?semester=${encodeURIComponent(sem)}`,
        faculty: (id, sem) => `/faculty-timetable-pdf/${id}?semester=${encodeURIComponent(sem)}`,
        room:    (id, sem) => `/room-timetable-pdf/${id}?semester=${encodeURIComponent(sem)}`,
        course:  (id, sem) => `/course-timetable-pdf/${id}?semester=${encodeURIComponent(sem)}`,
    };

    function buildTimetableUrl(type, id, semester) {
        return (htmlRouteMap[type] || htmlRouteMap['section'])(id, semester);
    }

    // ── Auto-resize iframe to its content ───────────────────────────────
    function autoResizeIframe(iframe) {
        try {
            const h = iframe.contentDocument.documentElement.scrollHeight;
            if (h > 100) iframe.style.height = h + 'px';
        } catch (e) { /* cross-origin guard */ }
    }

    // ── View mode toggle ────────────────────────────────────────────────
    window.setViewMode = function (mode) {
        viewMode = mode;
        document.getElementById('btnPagination').classList.toggle('active', mode === 'pagination');
        document.getElementById('btnScroll').classList.toggle('active', mode === 'scroll');

        const schedFrame    = document.getElementById('scheduleFrame');
        const scrollContent = document.getElementById('scrollContent');
        const navBar        = document.getElementById('schedNavBar');
        const filterToolbar = document.getElementById('filterToolbar');

        if (mode === 'pagination') {
            schedFrame.style.display    = '';
            scrollContent.style.display = 'none';
            navBar.style.display        = '';
            filterToolbar.classList.remove('scroll-mode');
            loadSchedule();
        } else {
            schedFrame.style.display    = 'none';
            scrollContent.style.display = '';
            navBar.style.display        = 'none';
            filterToolbar.classList.add('scroll-mode');
            loadAllSchedules();
        }
    };

    // ── Ctrl + scroll wheel = zoom in scroll mode ───────────────────────
    var _ctrlHeld = false;

    function _setIframePointerEvents(val) {
        if (viewMode !== 'scroll') return;
        document.querySelectorAll('#scrollPagesInner iframe').forEach(function (fr) {
            fr.style.pointerEvents = val;
        });
    }

    document.addEventListener('keydown', function (e) {
        if ((e.key === 'Control' || e.key === 'Meta') && !_ctrlHeld) {
            _ctrlHeld = true;
            _setIframePointerEvents('none');
        }
    });

    document.addEventListener('keyup', function (e) {
        if (e.key === 'Control' || e.key === 'Meta') {
            _ctrlHeld = false;
            _setIframePointerEvents('');
        }
    });

    // Reset if window loses focus (e.g. Alt+Tab while holding Ctrl)
    window.addEventListener('blur', function () {
        _ctrlHeld = false;
        _setIframePointerEvents('');
    });

    window.addEventListener('wheel', function (e) {
        if (!e.ctrlKey || viewMode !== 'scroll') return;
        e.preventDefault();
        scrollZoom += e.deltaY > 0 ? -0.08 : 0.08;
        scrollZoom = Math.max(0.2, Math.min(1.5, scrollZoom));
        document.getElementById('scrollPagesInner').style.zoom = scrollZoom;
    }, { passive: false });

    // ── Load ALL schedules in scroll mode (iframe-based) ────────────────
    window.loadAllSchedules = function () {
        const list  = listMap[currentType] || [];
        const inner = document.getElementById('scrollPagesInner');
        inner.style.zoom = scrollZoom;
        inner.innerHTML  = '';

        list.forEach(entity => {
            const wrap = document.createElement('div');
            wrap.className = 'scroll-sched-page';
            wrap.id        = `ssp-${entity.id}`;

            const iframe = document.createElement('iframe');
            iframe.src    = buildTimetableUrl(currentType, entity.id, currentSemester);
            iframe.title  = entity.label;
            iframe.style.cssText = 'width:900px;height:700px;border:none;display:block;';
            iframe.onload = function () { autoResizeIframe(iframe); };

            wrap.appendChild(iframe);
            inner.appendChild(wrap);
        });
    };

    // ── PDF download button ─────────────────────────────────────────────
    function updatePdfBtn() {
        const link = document.getElementById('pdfExportLink');
        if (currentId && pdfRouteMap[currentType]) {
            link.href = pdfRouteMap[currentType](currentId, currentSemester);
            link.style.pointerEvents = '';
            link.style.opacity = '1';
        } else {
            link.href = '#';
            link.style.pointerEvents = 'none';
            link.style.opacity = '0.4';
        }
    }

    // ── Switch semester ─────────────────────────────────────────────────
    window.switchSemester = function (sem) {
        currentSemester = sem;
        document.querySelectorAll('.semester-btn').forEach(btn => {
            const active = btn.dataset.sem === sem;
            btn.classList.toggle('btn-success', active);
            btn.classList.toggle('btn-outline-secondary', !active);
        });
        updatePdfBtn();
        if (viewMode === 'scroll') loadAllSchedules();
        else loadSchedule();
    };

    // ── Rebuild entity dropdown when type changes ───────────────────────
    window.onTypeChange = function () {
        currentType = document.getElementById('typeSelect').value;
        const sel   = document.getElementById('entitySelect');
        const list  = listMap[currentType] || [];
        sel.innerHTML = list.map(e => `<option value="${e.id}">${e.label}</option>`).join('');
        currentId = list.length ? list[0].id : null;
        updateNav();
        updatePdfBtn();
        if (viewMode === 'scroll') loadAllSchedules();
        else loadSchedule();
        history.pushState({}, '', `?type=${currentType}&id=${currentId}&semester=${encodeURIComponent(currentSemester)}`);
    };

    // ── Load single schedule (pagination mode via iframe) ───────────────
    window.loadSchedule = function () {
        const sel = document.getElementById('entitySelect');
        currentId = parseInt(sel.value) || null;
        if (!currentId) return;
        updateNav();
        updatePdfBtn();

        // In scroll mode — scroll to that entity's page instead
        if (viewMode === 'scroll') {
            const target = document.getElementById(`ssp-${currentId}`);
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            return;
        }

        history.pushState({}, '', `?type=${currentType}&id=${currentId}&semester=${encodeURIComponent(currentSemester)}`);

        const iframe = document.getElementById('scheduleFrame');
        iframe.style.height = '600px'; // reset before load
        iframe.onload = function () { autoResizeIframe(iframe); };
        iframe.src = buildTimetableUrl(currentType, currentId, currentSemester);
    };

    // ── Prev / Next navigation ──────────────────────────────────────────
    window.navigate = function (dir) {
        const list = listMap[currentType] || [];
        const idx  = list.findIndex(e => e.id === currentId);
        const next = idx + dir;
        if (next < 0 || next >= list.length) return;
        document.getElementById('entitySelect').value = list[next].id;
        loadSchedule();
    };

    function updateNav() {
        const list = listMap[currentType] || [];
        const idx  = list.findIndex(e => e.id === currentId);
        document.getElementById('navLabel').textContent = idx >= 0 ? `${idx + 1} / ${list.length}` : '—';
        document.getElementById('liPrev').classList.toggle('disabled', idx <= 0);
        document.getElementById('liNext').classList.toggle('disabled', idx < 0 || idx >= list.length - 1);
        const ji = document.getElementById('schedJumpInput');
        if (ji) { ji.max = list.length; ji.placeholder = `1–${list.length}`; }
    }

    // ── Jump-to ─────────────────────────────────────────────────────────
    window.schedJump = function () {
        const ji   = document.getElementById('schedJumpInput');
        const list = listMap[currentType] || [];
        const n    = parseInt(ji.value);
        if (!isNaN(n) && n >= 1 && n <= list.length) {
            document.getElementById('entitySelect').value = list[n - 1].id;
            loadSchedule();
            ji.value = '';
        } else {
            ji.classList.add('is-invalid');
            setTimeout(() => ji.classList.remove('is-invalid'), 1500);
        }
    };

    // ── Init ────────────────────────────────────────────────────────────
    const initSel = document.getElementById('entitySelect');
    if (initSel && initSel.value) {
        currentId = parseInt(initSel.value);
        updateNav();
        updatePdfBtn();
        loadSchedule();
    } else {
        updateNav();
        updatePdfBtn();
    }

    const schedJI = document.getElementById('schedJumpInput');
    if (schedJI) schedJI.addEventListener('keydown', e => { if (e.key === 'Enter') window.schedJump(); });

    document.addEventListener('keydown', function (e) {
        if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
        if (viewMode === 'scroll') return;
        if (document.querySelector('.modal.show')) return;
        const tag = document.activeElement ? document.activeElement.tagName : '';
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
        if (e.key === 'ArrowLeft') navigate(-1);
        else navigate(1);
    });
})();
</script>

{% endblock %}
