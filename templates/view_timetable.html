{% extends "base.html" %}

{% block title %}Canvas Workspace - View Timetable{% endblock %}

{% block content %}

<style>
    /* ── INFINITE CANVAS CORE ───────────────────────────────────── */
    :root {
        --canvas-bg: #f8fafc;
        --grid-color: rgba(0, 0, 0, 0.05);
        --accent-green: #198754;
        --card-shadow: 0 10px 40px rgba(0,0,0,0.1);
        --hud-bg: rgba(255, 255, 255, 0.85);
    }


    body {
        overflow: hidden !important; 
        transition: background-color 0.4s ease;
        background-color: #f8fafc;
    }

    #canvas-viewport {
        position: fixed;
        top: 92px; /* Below navbar */
        left: 0;
        right: 0;
        bottom: 0;
        background-color: var(--canvas-bg);
        background-image:
            radial-gradient(rgba(0,0,0,0.18) 1px, transparent 1px);
        background-size: 22px 22px;
        overflow: hidden;
        cursor: grab;
        user-select: none;
    }

    #canvas-viewport:active {
        cursor: grabbing;
    }

    #infinite-canvas {
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: 0 0;
        display: flex;
        flex-wrap: wrap;
        gap: 60px;
        padding: 500px; /* Massive padding to allow panning far out */
        width: fit-content;
        transition: transform 0.05s linear;
        will-change: transform;
    }

    /* ── STICKER CARDS (PAPER-ONLY REFINED) ────────────────── */
    .sticker-card {
        background: transparent; 
        border-radius: 0;
        box-shadow: none; 
        border: none;
        overflow: visible;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        padding: 0;
    }

    .sticker-card:hover {
        transform: translateY(-5px) scale(1.02);
        z-index: 20;
    }

    .sticker-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: url('https://www.transparenttextures.com/patterns/paper.png');
        opacity: 0.1;
        pointer-events: none;
        z-index: 1;
    }

    .card-iframe-wrap {
        width: 800px; 
        height: 1130px; 
        background: white;
        border: 1px solid #ddd;
        position: relative;
        overflow: hidden;
        box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }

    .card-iframe-wrap iframe {
        width: 800px;
        height: 1130px;
        border: none;
        pointer-events: none;
        transform: scale(1.0); 
        transform-origin: top left;
        transition: opacity 0.3s ease;
        overflow: hidden;
    }

    .card-header-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 34px;
        background: var(--accent-green);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        color: white;
        font-weight: bold;
        font-size: 0.85rem;
        z-index: 10;
    }

    .card-maximize-btn {
        background: rgba(255,255,255,0.2);
        color: white;
        border: none;
        width: 24px;
        height: 24px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 0.75rem;
    }
    .card-maximize-btn:hover { background: rgba(255,255,255,0.4); transform: scale(1.1); }

    #presentation-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.7);
        z-index: 2000;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.4s ease;
        cursor: grab;
        user-select: none;
    }

    #presentation-overlay.active {
        display: flex;
        opacity: 1;
    }

    #presentation-overlay:active {
        cursor: grabbing;
    }

    .pres-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden; /* Prevent leakage */
    }

    .pres-iframe-wrap {
        width: 800px;
        height: 1130px;
        background: white;
        box-shadow: 0 0 100px rgba(0,0,0,0.8);
        transform-origin: center center;
        transition: transform 0.05s linear;
        pointer-events: auto; /* Catch clicks to prevent backdrop exit bleed-through */
    }

    .canvas-card {
        transition: opacity 0.3s ease, transform 0.05s linear;
    }
    .canvas-card.canvas-dimmed {
        opacity: 0.15;
        pointer-events: none;
    }

    .pres-iframe-wrap iframe {
        width: 100%;
        height: 100%;
        border: none;
        pointer-events: none;
    }

    .pres-nav-btn {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        width: 70px;
        height: 70px;
        background: rgba(255,255,255,0.05);
        color: white;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        cursor: pointer;
        z-index: 2100;
        transition: all 0.3s;
    }

    .pres-nav-btn:hover { background: var(--accent-green); border-color: var(--accent-green); transform: translateY(-50%) scale(1.1); }
    .pres-nav-prev { left: 30px; }
    .pres-nav-next { right: 30px; }

    .pres-nav {
        position: absolute;
        top: 50%;
        width: 110%;
        left: -5%;
        transform: translateY(-50%);
        display: flex;
        justify-content: space-between;
        pointer-events: none;
    }

    .pres-btn {
        width: 60px;
        height: 60px;
        background: rgba(255,255,255,0.1);
        color: white;
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        cursor: pointer;
        pointer-events: auto;
        transition: all 0.3s;
    }

    .pres-btn:hover { background: var(--accent-green); transform: scale(1.1); }

    .pres-close {
        position: fixed;
        top: 30px;
        right: 30px;
        color: rgba(255,255,255,0.4);
        font-size: 2.5rem;
        cursor: pointer;
        z-index: 2100;
        transition: color 0.3s;
    }
    .pres-close:hover { color: white; }

    .pres-footer {
        color: rgba(255,255,255,0.5);
        margin-top: 20px;
        font-size: 0.9rem;
        letter-spacing: 1px;
    }

    /* ── FLOATING HUD (PILL DESIGN) ────────────────────────── */
    .hud-controls {
        position: fixed;
        top: 110px;
        left: 50%;
        transform: translateX(-50%);
        background: #fff;
        padding: 8px 18px;
        border-radius: 50px;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.12);
        z-index: 1000;
        border: 1px solid #e0e0e0;
        transition: all 0.3s ease;
    }
    .hud-controls.focus-mode { display: none !important; }

    .hud-title-pill { font-size: 0.9rem; font-weight: 800; color: var(--accent-green); display: flex; align-items: center; gap: 6px; padding-right: 15px; border-right: 1px solid #eee; }
    .hud-pill-segment { display: flex; align-items: center; gap: 8px; background: #f8f9fa; border-radius: 30px; padding: 4px 12px; border: 1px solid #eee; }
    .hud-pill-label { font-size: 0.75rem; color: #666; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .hud-pill-select { border: none !important; background: transparent; font-weight: 700; font-size: 0.85rem; color: #333; cursor: pointer; padding: 0 5px !important; width: auto; }
    .hud-search-pill { background: #f8f9fa; border-radius: 30px; padding: 4px 15px; border: 1px solid #eee; display: flex; align-items: center; gap: 8px; width: 180px; }
    .hud-search-pill input { border: none !important; background: transparent !important; font-size: 0.85rem; outline: none; width: 100%; color: #333; }
    .hud-pill-btn { border-radius: 30px !important; padding: 6px 20px !important; font-size: 0.8rem !important; font-weight: 700 !important; white-space: nowrap !important; }
    
    .hud-zoom-pill { display: flex; align-items: center; background: #f8f9fa; border-radius: 30px; padding: 4px 8px; border: 1px solid #eee; gap: 10px; }
    .hud-zoom-btn { width: 26px; height: 26px; border-radius: 50% !important; display: flex; align-items: center; justify-content: center; background: #fff !important; border: 1px solid #ddd !important; padding: 0 !important; color: #666; transition: all 0.2s; cursor: pointer; }
    .hud-zoom-btn:hover { background: #eee !important; color: #000; }
    .hud-zoom-val { font-size: 0.85rem; font-weight: 700; color: var(--accent-green); min-width: 45px; text-align: center; }

    /* ── MINIMAP ────────────────────────────────────────────── */
    #minimap-container {
        position: fixed;
        bottom: 25px;
        right: 25px;
        width: 200px;
        height: 150px;
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(10px);
        border-radius: 12px;
        border: 1px solid rgba(0,0,0,0.1);
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        z-index: 1000;
        overflow: hidden;
    }

    #minimap-viewport-box {
        position: absolute;
        border: 2px solid var(--accent-green);
        background: rgba(25, 135, 84, 0.1);
        pointer-events: none;
    }

    #minimap-content {
        position: relative;
        width: 100%;
        height: 100%;
        transform-origin: 0 0;
    }

    .minimap-dot {
        position: absolute;
        width: 10px;
        height: 8px;
        background: #cbd5e1;
        border-radius: 1px;
    }

    /* ── ZOOM INDICATOR ───────────────────────────────────────── */
    #zoom-badge {
        position: fixed;
        bottom: 25px;
        left: 25px;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(8px);
        padding: 5px 15px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: bold;
        color: var(--accent-green);
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        z-index: 1000;
    }

    @media print {
        #canvas-viewport, .hud-controls, #minimap-container, #zoom-badge { display: none !important; }
        body { overflow: auto !important; }
    }
</style>

<!-- REDESIGNED FLOATING HUD -->
<div class="hud-controls">
    <div class="hud-title-pill">
        <i class="bi bi-calendar3-fill"></i> Timetable
    </div>

    <div class="hud-pill-segment">
        <span class="hud-pill-label">View:</span>
        <select id="typeSelect" class="hud-pill-select" onchange="resetAndLoad()">
            <option value="section" {% if current_type=='section' %}selected{% endif %}>Sections</option>
            <option value="faculty" {% if current_type=='faculty' %}selected{% endif %}>Faculty</option>
            <option value="room"    {% if current_type=='room' %}selected{% endif %}>Rooms</option>
        </select>
    </div>
    
    <div class="hud-pill-segment">
        <span class="hud-pill-label">Sort:</span>
        <select id="sortSelect" class="hud-pill-select" onchange="applySort()">
            <option value="asc">A → Z</option>
            <option value="desc">Z → A</option>
        </select>
    </div>

    <div class="hud-search-pill">
        <i class="bi bi-search" style="color:#999; font-size:0.8rem;"></i>
        <input type="text" id="canvasSearch" placeholder="Find schedule..." onkeyup="applySearch()">
    </div>

    <div class="d-flex align-items-center gap-2">
        <button class="btn btn-outline-success hud-pill-btn d-flex align-items-center gap-2" onclick="fitAll()">
            <i class="bi bi-arrows-angle-contract"></i> <span>Fit All</span>
        </button>
        <button class="btn btn-success hud-pill-btn d-flex align-items-center gap-2" onclick="centerView()">
            <i class="bi bi-arrows-fullscreen"></i> <span>Center</span>
        </button>
        
        <div class="hud-zoom-pill">
            <div class="hud-zoom-btn" onclick="zoomCanvas(-0.1)"><i class="bi bi-dash"></i></div>
            <span class="hud-zoom-val" id="hud-zoom-level">100%</span>
            <div class="hud-zoom-btn" onclick="zoomCanvas(0.1)"><i class="bi bi-plus"></i></div>
        </div>
    </div>
</div>

<div id="zoom-badge">Zoom: 100%</div>

<!-- MINIMAP -->
<div id="minimap-container">
    <div id="minimap-content"></div>
    <div id="minimap-viewport-box"></div>
</div>

<!-- PRESENTATION OVERLAY -->
<div id="presentation-overlay">
    <span class="pres-close" onclick="closePresentation()"><i class="bi bi-x-lg"></i></span>
    
    <button class="pres-nav-btn pres-nav-prev" onclick="showPrev()"><i class="bi bi-chevron-left"></i></button>
    <button class="pres-nav-btn pres-nav-next" onclick="showNext()"><i class="bi bi-chevron-right"></i></button>

    <div class="pres-container" id="pres-backdrop">
        <div class="pres-iframe-wrap" id="pres-wrap">
            <iframe id="pres-iframe"></iframe>
        </div>
    </div>
    
    <div class="pres-footer">
        <span id="pres-label">...</span> &nbsp;|&nbsp; Press <kbd>ESC</kbd> to exit &nbsp;|&nbsp; Drag to Pan &nbsp;|&nbsp; Scroll to Zoom
    </div>
</div>

<!-- VIEWPORT & CANVAS -->
<div id="canvas-viewport">
    <div id="infinite-canvas">
        <!-- Timetables will be loaded here dynamically -->
    </div>
</div>

<script>
(function() {
    // ── Data from Flask ──────────────────────────────────────────
    const _sec = {{ sections_json | tojson | safe }};
    const _fac = {{ faculty_json  | tojson | safe }};
    const _rom = {{ rooms_json    | tojson | safe }};
    const listMap = { section: [..._sec], faculty: [..._fac], room: [..._rom] };

    window.applySort = function() {
        const dir = document.getElementById('sortSelect').value;
        [['section', _sec], ['faculty', _fac], ['room', _rom]].forEach(([type, orig]) => {
            const nonTba = orig.filter(x => !x.label.startsWith('T.B.A.'));
            const tba    = orig.filter(x =>  x.label.startsWith('T.B.A.'));
            nonTba.sort((a, b) => dir === 'asc'
                ? a.label.localeCompare(b.label)
                : b.label.localeCompare(a.label));
            listMap[type] = [...nonTba, ...tba];
        });
        
        if (typeof loadCanvas === 'function') loadCanvas();
    };

    let currentType = '{{ current_type }}';
    let currentSemester = '{{ current_semester }}';
    let scale = 1.0;
    let translateX = 0;
    let translateY = 0;
    let isDragging = false;
    let startX, startY;
    
    const viewport = document.getElementById('canvas-viewport');
    const canvas = document.getElementById('infinite-canvas');
    const zoomBadge = document.getElementById('zoom-badge');
    const hudZoom = document.getElementById('hud-zoom-level');

    function updateTransform() {
        scale = Math.max(0.05, Math.min(3.0, scale));
        canvas.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        const zoomText = `${Math.round(scale * 100)}%`;
        zoomBadge.textContent = `Zoom: ${zoomText}`;
        if (hudZoom) hudZoom.textContent = zoomText;
        updateMinimapViewport();
        renderVisibleCards();
    }

    viewport.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.clientX - translateX;
        startY = e.clientY - translateY;
        viewport.style.cursor = 'grabbing';
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        translateX = e.clientX - startX;
        translateY = e.clientY - startY;
        updateTransform();
    });

    window.addEventListener('mouseup', () => {
        isDragging = false;
        viewport.style.cursor = 'grab';
    });

    viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (e.ctrlKey) {
            const zoomSpeed = 0.001; 
            const delta = -e.deltaY * zoomSpeed;
            const oldScale = scale;
            scale = Math.max(0.1, Math.min(2.0, scale + delta));
            const rect = viewport.getBoundingClientRect();
            translateX -= (e.clientX - rect.left - translateX) * (scale / oldScale - 1);
            translateY -= (e.clientY - rect.top - translateY) * (scale / oldScale - 1);
        } else {
            translateX -= e.deltaX;
            translateY -= e.deltaY;
        }
        updateTransform();
    }, { passive: false });

    window.resetAndLoad = function() {
        currentType = document.getElementById('typeSelect').value;
        loadCanvas();
        centerView();
    };

    window.allCardData = [];
    const urlMap = {
        section: id => `/section-timetable-html/${id}?semester=${encodeURIComponent(currentSemester)}&canvas=true`,
        faculty: id => `/faculty-timetable-html/${id}?semester=${encodeURIComponent(currentSemester)}&canvas=true`,
        room:    id => `/room-timetable-html/${id}?semester=${encodeURIComponent(currentSemester)}&canvas=true`
    };

    window.loadCanvas = function() {
        const list = listMap[currentType] || [];
        canvas.innerHTML = '';
        const columns = 5;
        window.allCardData = list.map((item, index) => ({
            id: item.id, label: item.label, lowerLabel: item.label.toLowerCase(),
            url: urlMap[currentType](item.id),
            x: (index % columns) * 950 + 500, y: Math.floor(index / columns) * 1300 + 500,
            width: 850, height: 1200, index: index, isMounted: false, element: null
        }));
        renderVisibleCards();
        initMinimap();
    };

    function renderVisibleCards() {
        const buffer = 1000;
        const rect = viewport.getBoundingClientRect();
        const vLeft = (-translateX - buffer) / scale, vTop = (-translateY - buffer) / scale;
        const vRight = (rect.width + buffer * 2) / scale + vLeft, vBottom = (rect.height + buffer * 2) / scale + vTop;

        window.allCardData.forEach(data => {
            const isVisible = (data.x < vRight && data.x + data.width > vLeft && data.y < vBottom && data.y + data.height > vTop);
            if (isVisible && !data.isMounted) mountCard(data);
            else if (!isVisible && data.isMounted) unmountCard(data);
        });
    }

    function mountCard(data) {
        const card = document.createElement('div');
        card.className = 'canvas-card sticker-card';
        card.style.cssText = `position:absolute;left:${data.x}px;top:${data.y}px;width:${data.width}px;height:${data.height}px;`;
        if (window.lastSearchQuery && !data.lowerLabel.includes(window.lastSearchQuery)) card.classList.add('canvas-dimmed');
        card.innerHTML = `<div class="card-header-bar"><span>${data.label}</span><button class="card-maximize-btn" onclick="openPresentation(${data.index})"><i class="bi bi-fullscreen"></i></button></div><div class="card-iframe-wrap"><iframe src="${data.url}" loading="lazy"></iframe></div>`;
        card.addEventListener('dblclick', () => openPresentation(data.index));
        canvas.appendChild(card);
        data.element = card;
        data.isMounted = true;
    }

    function unmountCard(data) {
        if (data.element) data.element.remove();
        data.element = null;
        data.isMounted = false;
    }

    window.applySearch = function() {
        const q = document.getElementById('canvasSearch').value.toLowerCase();
        window.lastSearchQuery = q;
        window.allCardData.forEach(card => {
            if (card.isMounted && card.element) {
                if (!q || card.lowerLabel.includes(q)) card.element.classList.remove('canvas-dimmed');
                else card.element.classList.add('canvas-dimmed');
            }
        });
        const found = window.allCardData.find(c => q && c.lowerLabel.includes(q));
        if (found) focusCard(found);
    };

    function focusCard(data) {
        const rect = viewport.getBoundingClientRect();
        translateX = (rect.width / 2) - (data.x + data.width / 2) * scale;
        translateY = (rect.height / 2) - (data.y + data.height / 2) * scale;
        updateTransform();
    }

    function getContentBounds() {
        if (!window.allCardData.length) return null;
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        window.allCardData.forEach(c => {
            minX = Math.min(minX, c.x); minY = Math.min(minY, c.y);
            maxX = Math.max(maxX, c.x + c.width); maxY = Math.max(maxY, c.y + c.height);
        });
        return { minX, minY, maxX, maxY, width: maxX - minX, height: maxY - minY };
    }

    window.fitAll = function() {
        const b = getContentBounds();
        if (!b) return;
        const vr = viewport.getBoundingClientRect();
        scale = Math.min((vr.width - 100) / b.width, (vr.height - 100) / b.height, 0.8);
        translateX = (vr.width / 2) - (b.minX + b.width / 2) * scale;
        translateY = (vr.height / 2) - (b.minY + b.height / 2) * scale;
        updateTransform();
    };

    window.centerView = function() {
        const b = getContentBounds();
        if (!b) return;
        const vr = viewport.getBoundingClientRect();
        const cvs = document.getElementById('infinite-canvas');
        
        // Target points: center of content bounds
        const targetX = b.minX + b.width / 2;
        const targetY = b.minY + b.height / 2;
        
        translateX = (vr.width / 2) - (targetX * scale);
        translateY = (vr.height / 2) - (targetY * scale);
        
        if (cvs) cvs.style.transition = 'transform 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
        updateTransform();
        setTimeout(() => { if (cvs) cvs.style.transition = 'transform 0.05s linear'; }, 650);
    };

    function initMinimap() {
        const mini = document.getElementById('minimap-content');
        if (!mini) return;
        mini.innerHTML = '';
        const b = getContentBounds();
        if (!b) return;

        const margin = 1000;
        const totalW = b.width + margin * 2;
        const totalH = b.height + margin * 2;
        const startX = b.minX - margin;
        const startY = b.minY - margin;

        window.allCardData.forEach(c => {
            const dot = document.createElement('div');
            dot.className = 'minimap-dot';
            dot.style.left = ((c.x - startX) / totalW) * 100 + '%';
            dot.style.top = ((c.y - startY) / totalH) * 100 + '%';
            mini.appendChild(dot);
        });

        window.miniBounds = { totalW, totalH, startX, startY };
    }

    document.getElementById('minimap-container')?.addEventListener('click', (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width;
        const y = (e.clientY - rect.top) / rect.height;

        if (!window.miniBounds) return;
        const { totalW, totalH, startX, startY } = window.miniBounds;

        const targetX = startX + x * totalW;
        const targetY = startY + y * totalH;

        setTimeout(() => canvas.style.transition = 'transform 0.05s linear', 600);
    });

    function updateMinimapViewport() {
        const box = document.getElementById('minimap-viewport-box');
        if (!box || !window.miniBounds) return;

        const { totalW, totalH, startX, startY } = window.miniBounds;
        const viewRect = viewport.getBoundingClientRect();

        const vX = -translateX / scale;
        const vY = -translateY / scale;
        const vW = viewRect.width / scale;
        const vH = viewRect.height / scale;

        // Map canvas visible area to minimap 200x150 container
        const miniW = 200;
        const miniH = 150;

        box.style.width = (vW / totalW) * miniW + 'px';
        box.style.height = (vH / totalH) * miniH + 'px';
        box.style.left = ((vX - startX) / totalW) * miniW + 'px';
        box.style.top = ((vY - startY) / totalH) * miniH + 'px';
    }

    window.addEventListener('load', () => {
        applySort();
        resetView();
    });

    // ── PRESENTATION LOGIC (INTERACTIVE) ─────────────────────────
    let currentPresIndex = -1;
    let presScale = 1.0;
    let presX = 0;
    let presY = 0;
    let isPresDragging = false;
    let presStartX, presStartY;

    const presOverlay = document.getElementById('presentation-overlay');
    const presIframe = document.getElementById('pres-iframe');
    const presLabel = document.getElementById('pres-label');
    const presWrap = document.getElementById('pres-wrap');

    function updatePresTransform() {
        presWrap.style.transform = `translate(${presX}px, ${presY}px) scale(${presScale})`;
    }

    window.openPresentation = function(index) {
        currentPresIndex = index;
        const list = listMap[currentType] || [];
        if (index < 0 || index >= list.length) return;

        // Reset Transform for New Slide
        const baseScale = Math.min(1.0, (window.innerHeight * 0.9) / 1130);
        presScale = baseScale;
        presX = 0;
        presY = 0;
        updatePresTransform();

        const item = list[index];
        const urlMap = {
            section: id => `/section-timetable-html/${id}?semester=${encodeURIComponent(currentSemester)}&canvas=true`,
            faculty: id => `/faculty-timetable-html/${id}?semester=${encodeURIComponent(currentSemester)}&canvas=true`,
            room:    id => `/room-timetable-html/${id}?semester=${encodeURIComponent(currentSemester)}&canvas=true`
        };

        presIframe.src = urlMap[currentType](item.id);
        presLabel.textContent = item.label;
        presOverlay.classList.add('active');
        document.body.style.overflow = 'hidden';

        // FOCUS MODE: Hide HUD and main navbar
        const hud = document.querySelector('.hud-controls');
        if (hud) hud.classList.add('focus-mode');
        const mainNav = document.querySelector('.sheets-menubar');
        if (mainNav) mainNav.classList.add('d-none');
    };

    window.closePresentation = function() {
        presOverlay.classList.remove('active');
        presIframe.src = '';
        document.body.style.overflow = 'auto';

        // FOCUS MODE: Show HUD and main navbar
        const hud = document.querySelector('.hud-controls');
        if (hud) hud.classList.remove('focus-mode');
        const mainNav = document.querySelector('.sheets-menubar');
        if (mainNav) mainNav.classList.remove('d-none');
    };

    // Close on backdrop click (Only if clicking background, not paper)
    presOverlay.addEventListener('click', (e) => {
        if (e.target.id === 'pres-backdrop' || e.target.id === 'presentation-overlay') {
            closePresentation();
        }
    });

    // Prevent backdrop exit when clicking/dragging the paper card
    presWrap.addEventListener('click', (e) => {
        e.stopPropagation();
    });

    // Panning inside Presentation
    presOverlay.addEventListener('mousedown', (e) => {
        if (e.target.closest('.pres-nav-btn') || e.target.closest('.pres-close')) return;
        isPresDragging = true;
        presStartX = e.clientX - presX;
        presStartY = e.clientY - presY;
    });

    window.addEventListener('mousemove', (e) => {
        if (!isPresDragging || !presOverlay.classList.contains('active')) return;
        presX = e.clientX - presStartX;
        presY = e.clientY - presStartY;
        updatePresTransform();
    });

    window.addEventListener('mouseup', () => {
        isPresDragging = false;
    });

    // Zooming inside Presentation
    presOverlay.addEventListener('wheel', (e) => {
        if (!presOverlay.classList.contains('active')) return;
        e.preventDefault();
        
        const zoomSpeed = 0.0015;
        const delta = -e.deltaY * zoomSpeed;
        const oldScale = presScale;
        presScale = Math.max(0.4, Math.min(4.0, presScale + delta));

        // Center zoom on mouse? For simple pan, we usually just scale.
        // Let's keep it simple for now as per user request.
        updatePresTransform();
    }, { passive: false });



    window.showNext = function() {
        const list = listMap[currentType] || [];
        if (currentPresIndex < list.length - 1) {
            openPresentation(currentPresIndex + 1);
        } else {
            openPresentation(0);
        }
    };

    window.showPrev = function() {
        const list = listMap[currentType] || [];
        if (currentPresIndex > 0) {
            openPresentation(currentPresIndex - 1);
        } else {
            openPresentation(list.length - 1);
        }
    };

    // Keyboard Navigation
    window.addEventListener('keydown', (e) => {
        if (!presOverlay.classList.contains('active')) return;
        if (e.key === 'ArrowRight') showNext();
        if (e.key === 'ArrowLeft') showPrev();
        if (e.key === 'Escape') closePresentation();
    });

    window.exportAllPDF = function() {
        alert("This will compile all visible schedules into a single PDF document. (Feature in progress)");
    };

})();
</script>

{% endblock %}
