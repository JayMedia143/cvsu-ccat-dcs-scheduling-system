<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CvSU-CCAT | System Auditor Console</title>
    
    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --glass-bg: rgba(15, 23, 42, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --accent-orange: #f59e0b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --sidebar-width: 280px;
        }

        body {
            background: #020617;
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: var(--sidebar-width);
            background: rgba(15, 23, 42, 0.95);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .sidebar-header {
            padding: 2rem 1.5rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            background: var(--accent-green);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: white;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }

        .brand-text {
            font-weight: 800;
            letter-spacing: -0.5px;
            font-size: 1.1rem;
        }

        .phase-list {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 0.75rem;
        }

        .phase-item {
            padding: 0.75rem 1rem;
            border-radius: 10px;
            margin-bottom: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .phase-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: white;
        }

        .phase-item.active {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: var(--accent-blue);
        }

        .phase-badge {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* --- Main Content --- */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at top right, rgba(16, 185, 129, 0.05), transparent);
        }

        .top-nav {
            height: 70px;
            padding: 0 2rem;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(10px);
        }

        .audit-controls {
            display: flex;
            gap: 12px;
        }

        .btn-tester {
            padding: 8px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .btn-run {
            background: var(--accent-blue);
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }
        .btn-run:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4); }

        .btn-export {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
        }

        .status-overview {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .stat-val { font-weight: 800; font-size: 1.1rem; line-height: 1; }
        .stat-label { font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase; margin-top: 4px; }

        /* --- Audit Workspace --- */
        .workspace {
            padding: 2rem;
            flex: 1;
            overflow-y: auto;
        }

        .section-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 2rem;
        }

        .section-header {
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .audit-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        .audit-table th {
            padding: 1rem 1.5rem;
            text-align: left;
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-secondary);
            font-weight: 600;
            border-bottom: 1px solid var(--glass-border);
        }

        .audit-table td {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--glass-border);
            font-size: 0.95rem;
        }

        .item-name { font-weight: 600; }
        .item-desc { color: var(--text-secondary); font-size: 0.85rem; display: block; margin-top: 4px; }

        .badge-status {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-pending { background: rgba(148, 163, 184, 0.1); color: #94a3b8; }
        .status-checking { background: rgba(59, 130, 246, 0.1); color: #3b82f6; animation: pulse 1.5s infinite; }
        .status-ok { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .status-error { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
        .status-manual { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .btn-verify {
            background: #1e293b;
            border: 1px solid var(--glass-border);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        /* --- Progress Bar --- */
        .progress-container {
            position: fixed;
            bottom: 0;
            left: var(--sidebar-width);
            right: 0;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            z-index: 1000;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
            width: 0%;
            transition: width 0.3s ease;
        }

        /* --- Iframe Modal --- */
        .preview-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .preview-window {
            width: 90%;
            height: 85%;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .preview-header {
            padding: 1rem 1.5rem;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #0f172a;
        }

        iframe#audit-frame {
            border: none;
            flex: 1;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="brand">
                <div class="brand-icon"><i class="bi bi-shield-check"></i></div>
                <div class="brand-text">SYSTEM TESTER</div>
            </div>
            <div style="font-size: 0.7rem; color: var(--text-secondary); margin-top: 8px;">HARAREN v2.25 | Diagnostic HUD</div>
        </div>

        <div class="phase-list" id="phase-list">
            <!-- Phases injected here -->
        </div>

        <div style="padding: 1rem; border-top: 1px solid var(--glass-border);">
            <div class="d-grid">
                <a href="/dashboard" class="btn btn-tester btn-export text-center justify-content-center">
                    <i class="bi bi-arrow-left"></i> Exit to Dashboard
                </a>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-container">
        <div class="top-nav">
            <div class="status-overview">
                <div class="stat-item">
                    <span class="stat-val" id="total-checked">0%</span>
                    <span class="stat-label">Automation Coverage</span>
                </div>
                <div class="stat-item">
                    <span class="stat-val text-success" id="total-passed">0</span>
                    <span class="stat-label">Functional</span>
                </div>
                <div class="stat-item">
                    <span class="stat-val text-danger" id="total-failed">0</span>
                    <span class="stat-label">Critical Errors</span>
                </div>
            </div>

            <div class="audit-controls">
                <button class="btn btn-tester btn-export" onclick="exportResults()">
                    <i class="bi bi-download"></i> Export JSON
                </button>
                <button class="btn btn-tester btn-run" id="btn-run-all" onclick="runFullAudit()">
                    <i class="bi bi-play-fill text-white"></i> RUN FULL SYSTEM SCAN
                </button>
            </div>
        </div>

        <div class="workspace">
            <div class="section-card">
                <div class="section-header">
                    <div>
                        <h4 id="current-phase-title" style="margin:0; font-weight: 800;">Select a Phase to begin</h4>
                        <span id="current-phase-subtitle" style="color: var(--text-secondary); font-size: 0.85rem;">Standby mode...</span>
                    </div>
                </div>

                <table class="audit-table">
                    <thead>
                        <tr>
                            <th style="width: 40%">Audit Target (Feature)</th>
                            <th style="width: 20%">Verifier Type</th>
                            <th style="width: 20%">Status</th>
                            <th style="width: 20%">Diagnostic Log</th>
                        </tr>
                    </thead>
                    <tbody id="audit-tbody">
                        <!-- Items injected here -->
                        <tr>
                            <td colspan="4" class="text-center py-5 text-secondary">
                                <i class="bi bi-terminal-fill d-block mb-3" style="font-size: 2rem; opacity: 0.2;"></i>
                                Ready to initialize functional sweep of Phases 0-12.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="global-progress"></div>
        </div>
    </div>

    <!-- Manual Preview Overlay -->
    <div class="preview-overlay" id="preview-overlay">
        <div class="preview-window">
            <div class="preview-header">
                <div>
                    <strong id="preview-title">Visual Verification</strong>
                    <span class="ms-3 text-secondary" style="font-size: 0.8rem;" id="preview-url"></span>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-sm btn-success" onclick="verifyManual(true)">Functional (200 OK)</button>
                    <button class="btn btn-sm btn-danger" onclick="verifyManual(false)">Log Issue</button>
                    <button class="btn btn-sm btn-secondary" onclick="closePreview()">Close</button>
                </div>
            </div>
            <iframe id="audit-frame"></iframe>
        </div>
    </div>

    <!-- Background Hidden Iframe for Scraper -->
    <iframe id="scraper-frame" style="display: none;"></iframe>

    <script>
        let auditData = [];
        let currentPhaseId = null;
        let isRunning = false;

        async function init() {
            try {
                const response = await fetch('/static/json/audit_manifest.json');
                auditData = await response.json();
                renderPhaseList();
                console.log("Auditor manifest initialized.");
            } catch (err) {
                console.error("Failed to load audit manifest:", err);
            }
        }

        function renderPhaseList() {
            const list = document.getElementById('phase-list');
            list.innerHTML = '';
            auditData.forEach(phase => {
                const item = document.createElement('div');
                item.className = 'phase-item';
                item.innerHTML = `
                    <span>Phase ${phase.id}: ${phase.title}</span>
                    <span class="phase-badge">${phase.items.length}</span>
                `;
                item.onclick = () => selectPhase(phase.id);
                list.appendChild(item);
            });
        }

        function selectPhase(id) {
            currentPhaseId = id;
            const phase = auditData.find(p => p.id === id);
            
            // Update Active State
            document.querySelectorAll('.phase-item').forEach((it, idx) => {
                it.classList.toggle('active', idx === auditData.indexOf(phase));
            });

            document.getElementById('current-phase-title').innerText = `Phase ${phase.id}: ${phase.title}`;
            document.getElementById('current-phase-subtitle').innerText = `${phase.items.length} interactive features mapped.`;

            const tbody = document.getElementById('audit-tbody');
            tbody.innerHTML = '';

            phase.items.forEach((item, idx) => {
                const row = document.createElement('tr');
                row.id = `item-${id}-${idx}`;
                const isAuto = item.type === 'auto' || item.type === 'logic';
                row.innerHTML = `
                    <td>
                        <span class="item-name">${item.name}</span>
                        <span class="item-desc">${item.description}</span>
                    </td>
                    <td>
                        <span style="font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase;">
                            <i class="bi ${item.type === 'auto' ? 'bi-cpu text-info' : (item.type === 'logic' ? 'bi-gear-wide-connected text-primary' : 'bi-eye text-warning')} me-2"></i> ${item.type}
                        </span>
                    </td>
                    <td>
                        <span class="badge-status status-${item.status}">${item.status}</span>
                    </td>
                    <td class="diagnostic-log" style="font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--text-secondary);">
                        ${item.status === 'pending' ? (isAuto ? 'Ready for auto-scan' : 'Waiting for manual review') : (item.log || 'Verified')}
                        ${item.type === 'manual' ? `<br><button class="btn-verify mt-2" onclick="openPreview('${item.url}', '${id}', '${idx}')">View Page</button>` : ''}
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        async function runFullAudit() {
            if (isRunning) return;
            isRunning = true;
            document.getElementById('btn-run-all').innerHTML = '<i class="bi bi-hourglass-split text-white"></i> ANALYZING SYSTEM...';
            
            const totalItems = auditData.reduce((sum, p) => sum + p.items.length, 0);
            let processed = 0;

            for (const phase of auditData) {
                selectPhase(phase.id);
                for (let i = 0; i < phase.items.length; i++) {
                    const item = phase.items[i];
                    if (item.type === 'auto') {
                        updateStatus(phase.id, i, 'checking', 'Probing DOM selectors...');
                        const result = await verifySelectorOnPage(item.url, item.name);
                        if (result.ok) {
                            updateStatus(phase.id, i, 'ok', 'Selector Resolved (200 OK)');
                        } else {
                            updateStatus(phase.id, i, 'error', result.error);
                        }
                    } else {
                        updateStatus(phase.id, i, 'manual', 'Requires human sign-off');
                    }
                    processed++;
                    updateProgress(processed, totalItems);
                }
            }

            isRunning = false;
            document.getElementById('btn-run-all').innerHTML = '<i class="bi bi-check-circle-fill text-white"></i> SCAN COMPLETE';
        }

        async function verifySelectorOnPage(url, featureName) {
            const cleanFeature = featureName.toLowerCase().replace(/['"]+/g, '');
            const search = cleanFeature.replace(/^[a-z]+:\s*/, '');
            const isLogic = featureName.includes('Logic:') || featureName.includes('Badge:');

            // 1. Logic Check (Backend Probe)
            if (isLogic || url.includes('logic_ping')) {
                try {
                    const resp = await fetch('/api/audit/logic_ping');
                    const data = await resp.json();
                    if (data.status === 'ok') return { ok: true };
                    return { ok: false, error: "Backend Logic Pulse Failed" };
                } catch (e) {
                    return { ok: false, error: "Logic API Unreachable" };
                }
            }

            // 2. Fetch-Audit (Frontend Code Inspection)
            try {
                // Force audit mode to bypass session-based UI changes if any
                const auditUrl = url + (url.includes('?') ? '&' : '?') + 'audit_mode=1';
                const response = await fetch(auditUrl);
                
                if (!response.ok) {
                    return { ok: false, error: `HTTP ${response.status}: Page unreachable at [${auditUrl}]` };
                }

                const htmlText = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, "text/html");
                const bodyText = doc.body.innerText.toLowerCase();

                // Check 1: InnerText (Main heuristic)
                const textMatch = bodyText.includes(search);

                // Check 2: Attribute Sweep (Deep scan: inputs, placeholders, buttons)
                const allElements = doc.querySelectorAll('input, button, a, div, span, label, i');
                const attrMatch = Array.from(allElements).some(el => {
                    return (el.placeholder && el.placeholder.toLowerCase().includes(search)) ||
                           (el.name && el.name.toLowerCase().includes(search)) ||
                           (el.id && el.id.toLowerCase().includes(search)) ||
                           (el.title && el.title.toLowerCase().includes(search)) ||
                           (el.className && el.className.toLowerCase().includes(search)) ||
                           (el.getAttribute('data-bs-target') && el.getAttribute('data-bs-target').toLowerCase().includes(search));
                });

                if (textMatch || attrMatch) {
                    return { ok: true };
                } else {
                    return { ok: false, error: `Not Found: "${search}" not located in [${url}] source code.` };
                }
            } catch (e) {
                console.error("Fetch Error:", e);
                return { ok: false, error: `Connection Refused: Ensure you are using the same IP/Domain.` };
            }
        }

        function updateStatus(phaseId, itemIdx, status, log) {
            const phase = auditData.find(p => p.id === phaseId);
            phase.items[itemIdx].status = status;
            phase.items[itemIdx].log = log;

            const row = document.getElementById(`item-${phaseId}-${itemIdx}`);
            if (row) {
                const badge = row.querySelector('.badge-status');
                badge.className = `badge-status status-${status}`;
                badge.innerText = status;
                row.querySelector('.diagnostic-log').innerHTML = log + (phase.items[itemIdx].type === 'manual' ? `<br><button class="btn-verify mt-2" onclick="openPreview('${phase.items[itemIdx].url}', '${phaseId}', '${itemIdx}')">View Page</button>` : '');
            }
            updateCounters();
        }

        function updateCounters() {
            let total = 0, passed = 0, failed = 0, autos = 0, autoPassed = 0;
            auditData.forEach(p => {
                p.items.forEach(i => {
                    total++;
                    if (i.status === 'ok') passed++;
                    if (i.status === 'error') failed++;
                    if (i.type === 'auto') {
                        autos++;
                        if (i.status === 'ok') autoPassed++;
                    }
                });
            });
            document.getElementById('total-passed').innerText = passed;
            document.getElementById('total-failed').innerText = failed;
            const coverage = Math.round((autoPassed / (autos || 1)) * 100);
            document.getElementById('total-checked').innerText = `${coverage}%`;
        }

        function updateProgress(val, max) {
            const perc = (val / max) * 100;
            document.getElementById('global-progress').style.width = `${perc}%`;
        }

        // --- Preview Logic ---
        let manualContext = null;

        function openPreview(url, pid, idx) {
            manualContext = { pid, idx };
            document.getElementById('preview-url').innerText = url;
            document.getElementById('preview-title').innerText = `Manual Check: ${auditData.find(p => p.id == pid).items[idx].name}`;
            document.getElementById('audit-frame').src = url;
            document.getElementById('preview-overlay').style.display = 'flex';
        }

        function closePreview() {
            document.getElementById('preview-overlay').style.display = 'none';
        }

        function verifyManual(isOk) {
            if (manualContext) {
                updateStatus(parseInt(manualContext.pid), parseInt(manualContext.idx), isOk ? 'ok' : 'error', isOk ? 'Verified by Administrator' : 'Failed manual inspection');
            }
            closePreview();
        }

        function exportResults() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(auditData, null, 4));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "cvsu_audit_results.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        window.onload = init;
    </script>
</body>
</html>
