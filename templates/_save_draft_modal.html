
<!-- Save Draft Name Modal -->
<div class="modal fade" id="saveDraftNameModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 400px;">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 15px;">
            <div class="modal-header bg-light border-bottom-0 pt-4 px-4">
                <h5 class="modal-title fw-bold text-dark d-flex align-items-center">
                    <div class="rounded-circle bg-success bg-opacity-10 d-flex align-items-center justify-content-center me-3" style="width: 40px; height: 40px;">
                        <i class="bi bi-pencil-square text-success"></i>
                    </div>
                    <span id="saveDraftModalTitle">Save as Draft</span>
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body px-4 pb-4">
                <p class="text-muted small mb-3" id="saveDraftModalSubtext">Give this draft version a recognizable name.</p>
                <div class="mb-0">
                    <label class="form-label text-muted small fw-bold mb-1">Draft Name</label>
                    <input type="text" id="saveDraftInputName" class="form-control form-control-lg fs-6" 
                           placeholder="e.g. Mid-Semester Backup" 
                           style="border-radius: 7px; border: 1.5px solid #eee; background: #fdfdfd;">
                </div>
            </div>
            <div class="modal-footer border-top-0 px-4 pb-4 pt-0">
                <button type="button" class="btn btn-light px-4 fw-bold text-muted" data-bs-dismiss="modal" style="border-radius: 7px;">Cancel</button>
                <button type="button" id="btnConfirmSaveDraft" class="btn btn-success px-4 fw-bold" style="border-radius: 7px;">Save Draft</button>
            </div>
        </div>
    </div>
</div>
